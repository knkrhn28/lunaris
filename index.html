<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lunaris</title>
  <style>
    :root {
      --primary-color: #2563eb;
      --primary-hover: #1d4ed8;
      --bg-color: #f8fafc;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --card-bg: #ffffff;
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      max-width: 680px;
      margin: 0 auto;
      padding: 40px 20px;
      text-align: center;
      background-color: var(--bg-color);
      color: var(--text-main);
      line-height: 1.6;
    }

    p {
      font-size: 1.1rem;
      color: var(--text-muted);
      margin-bottom: 30px;
      font-style: italic;
      max-width: 500px;
      margin-left: auto;
      margin-right: auto;
    }

    .gif-container {
      margin: 0 auto 30px;
      min-height: 200px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--card-bg);
      border-radius: 24px;
      padding: 15px;
      box-shadow: var(--shadow);
      width: fit-content;
      max-width: 100%;
    }

    .gif-container img {
      max-width: 100%;
      max-height: 200px;
      border-radius: 12px;
      object-fit: contain;
    }

    button {
      padding: 16px 40px;
      font-size: 18px;
      font-weight: 600;
      background: var(--primary-color);
      color: white;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 4px 6px -1px rgba(37, 99, 235, 0.2);
      width: auto;
      min-width: 200px;
    }

    button:hover {
      background: var(--primary-hover);
      transform: translateY(-2px);
    }

    #sonuc {
      margin-top: 30px;
      font-size: clamp(24px, 8vw, 36px); /* Mobil için dinamik font boyutu */
      font-weight: 800;
      letter-spacing: 4px;
      min-height: 60px;
      color: var(--text-main);
      font-variant-numeric: tabular-nums;
      word-break: break-word; /* Sayılar sığmazsa alt satıra geçer */
      padding: 0 10px;
    }

    .info {
      margin-top: 50px;
      font-size: 12px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      opacity: 0.8;
    }

    @media (max-width: 480px) {
      body { padding: 20px 15px; }
      .gif-container { min-height: 180px; }
      button { width: 100%; }
    }
  </style>
</head>
<body>
  <p>Lunaris (lu-na-ris): Kurallarla yönetilen bu dünyada, plansızlığın ve spontaneliğin getirdiği o ani özgürlük hissi.</p>

  <div class="gif-container">
    <img id="randomGif" src="" alt="Yükleniyor...">
  </div>

  <button onclick="uret()">10 Sayı Üret !</button>

  <div id="sonuc">—</div>


  <script src="random-1-4.js"></script>
  <script>
    const gifs = [
      "https://media.giphy.com/media/l0MYC0LajbaPoEADu/giphy.gif",
      "https://media.giphy.com/media/xT9IgG50Fb7Mi0prBC/giphy.gif",
      "https://media.giphy.com/media/l0HlBO7eyXzSZkJri/giphy.gif",
      "https://media.giphy.com/media/xUA7aM09ByyR1w5YWc/giphy.gif",
      "https://media.giphy.com/media/3ohhwFAPgHdkuwE85G/giphy.gif",
      "https://media.giphy.com/media/rTngfTlB9wbLBG5Ia8/giphy.gif",
      "https://media.giphy.com/media/AY7moyUq2sTgArrJSs/giphy.gif",
      "https://media.giphy.com/media/3oz8xVlyQAXwnD9C2A/giphy.gif",
      "https://media.giphy.com/media/XtESoNon4ufgAjIk6m/giphy.gif",
      "https://media.giphy.com/media/XBizppqoOIAIH52Zzc/giphy.gif",
      "https://media.giphy.com/media/l0IukZ771bIyeJcS4/giphy.gif",
      "https://media.giphy.com/media/VGoZVlR9naOZCiRLSy/giphy.gif"
    ];

    function rastgeleGifGoster() {
      const rastgeleIndex = Math.floor(Math.random() * gifs.length);
      document.getElementById('randomGif').src = gifs[rastgeleIndex];
    }

    async function uret() {
      rastgeleGifGoster();
      const sonucDiv = document.getElementById('sonuc');
      sonucDiv.textContent = 'Üretiliyor...';
      
      const sayilar = await generateRandomNumbers(10, 1, 4);
      
      if (sayilar) {
        sonucDiv.textContent = sayilar.join('  ');
      } else {
        sonucDiv.textContent = 'Hata oluştu, tekrar dene';
      }
    }

    window.onload = rastgeleGifGoster;
  </script>
</body>
</html>
