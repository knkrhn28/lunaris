<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lunaris</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 600px;
      margin: 50px auto;
      padding: 20px;
      text-align: center;
      background: #f5f5f5;
    }
    button {
      padding: 12px 28px;
      font-size: 18px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    button:hover {
      background: #1d4ed8;
    }
    #sonuc {
      margin-top: 30px;
      font-size: 28px;
      font-weight: bold;
      letter-spacing: 4px;
      min-height: 40px;
    }
  </style>
</head>
<body>
  <h1>1-4 Arası Gerçek Rastgele Sayı</h1>

  <button onclick="uret()">10 Sayı Üret</button>

  <div id="sonuc">—</div>

  <script src="random-1-4.js"></script>
  <script>
    async function uret() {
      const sonucDiv = document.getElementById('sonuc');
      sonucDiv.textContent = 'Üretiliyor...';
      
      const sayilar = await generateRandomNumbers(10, 1, 4);
      
      if (sayilar) {
        sonucDiv.textContent = sayilar.join('  ');
      } else {
        sonucDiv.textContent = 'Hata oluştu, tekrar dene';
      }
    }
  </script>
</body>
</html>
